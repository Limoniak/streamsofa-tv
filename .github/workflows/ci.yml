# Tests à chaque push et pull request ; un tag `vX.Y.Z` publie en plus une release signée,
# que l'app propose ensuite en mise à jour.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   TWITCH_CLIENT_ID                 Client ID Twitch de l'app
#   LUMEN_KEYSTORE_BASE64            keystore de release encodé en base64 (requis pour un tag)
#   LUMEN_KEYSTORE_PASSWORD, LUMEN_KEY_ALIAS, LUMEN_KEY_PASSWORD
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # création de la release sur un tag
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # SDK Android préinstallé sur le runner ($ANDROID_HOME) : il ne manque que le NDK épinglé.
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests Rust
        working-directory: rust
        run: cargo test --locked

      - name: local.properties
        working-directory: android
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "twitch.clientId=${TWITCH_CLIENT_ID}" >> local.properties

      - name: Tests Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core-bridge:testDebugUnitTest :data:testDebugUnitTest :feature:auth:testDebugUnitTest :feature:player:testDebugUnitTest -Plumen.abis=x86_64

      - name: Keystore de release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: |
          # Sans la vraie clé, une release serait signée en debug et refusée en mise à jour.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret LUMEN_KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: APK de release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease -Plumen.versionName="$VERSION"
          mkdir -p ../dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "../dist/streamsofa-${VERSION}-${abi}.apk"
          done
          ls -l ../dist

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes : la section du CHANGELOG pour cette version, sinon celles générées par GitHub.
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]")} /^\[/{p = 0} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          # Un tag avec suffixe (`v1.2.0-beta.1`) publie une pré-version, proposée seulement aux bêta-testeurs.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then notes+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "StreamSofa ${GITHUB_REF_NAME#v}" "${notes[@]}"
