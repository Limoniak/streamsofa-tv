[package]
name = "lumen-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumen_core"
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# rustls + ring + racines Mozilla embarquées : ni OpenSSL, ni initialisation JNI.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "test-util"] }
wiremock = "0.6"
tempfile = "3"
